<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fanika — Debug log</title>
  <style>
    body {
      font: 14px/1.4 system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      background: #111;
      color: #eee;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: #aaa; margin: 0 0 12px; }
    textarea {
      width: 100%;
      height: calc(100vh - 120px);
      box-sizing: border-box;
      font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
      background: #1c1c1c;
      color: #d8f8d8;
      border: 1px solid #333;
      padding: 10px;
      white-space: pre;
    }
    button { margin-right: 8px; padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Fanika debug log</h1>
  <p>One log. New actions append here — nothing is downloaded.</p>
  <div>
    <button id="refresh">Refresh</button>
    <button id="clear">Clear log</button>
  </div>
  <textarea id="log" readonly spellcheck="false"></textarea>
  <script src="options.js"></script>
</body>
</html>
