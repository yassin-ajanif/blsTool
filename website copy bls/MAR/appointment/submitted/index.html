<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Morocco BLS Spain Visa: Booking Submitted</title>
  <link rel="shortcut icon" href="/assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="/assets/vendor/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/color.css">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/assets/vendor/jquery/dist/jquery.min.js"></script>
  <style>
    .bls-success-wrap {
      min-height: 55vh;
      display: flex;
      align-items: center;
    }
    .bls-success-card {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
      padding: 2.5rem 2rem;
      background: #fff;
      border: 1px solid #e7e7e7;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(11, 61, 145, 0.08);
    }
    .bls-success-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: #e8f5e9;
      color: #2e7d32;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .bls-success-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0b3d91;
      margin-bottom: 0.75rem;
    }
    .bls-success-card p {
      color: #555;
      margin-bottom: 0.5rem;
    }
    .bls-ref {
      display: inline-block;
      margin: 1rem 0 1.5rem;
      padding: 0.5rem 1rem;
      background: #f4f7fb;
      border-radius: 6px;
      font-family: Consolas, monospace;
      font-weight: 600;
      color: #0b3d91;
    }
  </style>
</head>
<body>
  <header class="navbar-light header-sticky">
    <nav class="navbar navbar-expand-xl z-index-9 navbar-divider">
      <div class="container">
        <a class="navbar-brand" href="/MAR/account/login/">
          <img class="light-mode-item navbar-brand-item" src="/assets/images/logo.svg" alt="BLS Logo">
          <img class="dark-mode-item navbar-brand-item" src="/assets/images/logo.svg" alt="logo">
        </a>
        <div class="navbar-collapse collapse show">
          <div class="nav my-3 my-xl-0 px-4 flex-nowrap align-items-center">
            <div class="align-items-center text-primary" style="font-size:24px;font-weight:700;">
              Apply for VISA to Spain In Morocco
            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="container bls-success-wrap py-5">
      <div class="bls-success-card w-100">
        <div class="bls-success-icon" aria-hidden="true">
          <i class="fa fa-check"></i>
        </div>
        <h1>Your booking has finally been submitted</h1>
        <p>Thank you. Your appointment request was submitted successfully in this local clone.</p>
        <p class="small text-muted mb-0">This is a mock confirmation page — no real BLS booking was created.</p>
        <div class="bls-ref" id="bookingRef">BLS-MOCK-000000</div>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
          <a class="btn btn-primary" href="/MAR/account/login/">Back to Login</a>
          <a class="btn btn-outline-primary" href="/MAR/appointment/newappointment/">Book Another</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var ref = 'BLS-MOCK-' + String(Date.now()).slice(-6);
      var el = document.getElementById('bookingRef');
      if (el) el.textContent = ref;
    })();
  </script>
  <script src="/assets/vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/mock-nav.js"></script>
</body>
</html>
